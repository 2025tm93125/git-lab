apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-blue-service
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: blue
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-service
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    version: canary
  ports:
    - port: 80
      targetPort: 5000
