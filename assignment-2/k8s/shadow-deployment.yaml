apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  labels:
    app: aceest-fitness-shadow
    version: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-shadow
  template:
    metadata:
      labels:
        app: aceest-fitness-shadow
        version: shadow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: aceest-fitness
          image: 2025tm93125/aceest-fitness-assignment-2:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-service
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness-shadow
  ports:
    - port: 80
      targetPort: 5000
